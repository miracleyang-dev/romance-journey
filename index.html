<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title>恋爱日志</title>
  <!-- 静态资源版本号：发版当天日期 yyyymmdd（同日多次发版可改为 yyyymmdd-HHMM）
       与 sw.js 中 APP_VERSION、manifest.json 中 version 同步维护即可。 -->
  <link rel="icon" type="image/svg+xml" sizes="any" href="icons/favicon.svg?v=20260620">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=20260620">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png?v=20260620">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=20260620">
  <link rel="manifest" href="manifest.json?v=20260620">
  <meta name="theme-color" content="#d4726a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="恋爱日志">
  <meta name="application-name" content="恋爱日志">
  <link rel="stylesheet" href="css/style.css?v=20260620">
  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <!-- ECharts（旅行足迹地图） -->
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <script src="js/config.js?v=20260620"></script>
</head>
<body>
  <!-- 顶栏 -->
  <header class="topbar">
    <button class="topbar__back" id="backBtn" hidden onclick="App.goBack()">&larr;</button>
    <span class="topbar__title" id="topTitle">恋爱日志</span>
    <button class="topbar__icon" onclick="App.goTab('settings')" aria-label="设置">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.32 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
  </header>

  <main class="main" id="main"></main>

  <!-- 底部导航（由 JS 动态渲染） -->
  <nav class="bottomnav" id="bottomnav"></nav>

  <!-- 弹窗 -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <div class="modal__header">
        <h3 id="modalTitle"></h3>
        <button class="modal__close" onclick="App.closeModal()">&times;</button>
      </div>
      <div class="modal__body" id="modalBody"></div>
    </div>
  </div>

  <script src="js/lunar.js?v=20260620"></script>
  <script src="js/store.js?v=20260620"></script>
  <script src="js/auth.js?v=20260620"></script>
  <script src="js/app.js?v=20260620"></script>

  <!-- 注册 Service Worker；版本号变化时新 SW 安装后会清掉旧 cache
       sw.js 实际位于 /js/sw.js，但通过 scope:'/' + 服务端 Service-Worker-Allowed: /
       响应头，仍然以全站作用域注册，PWA 缓存和离线能力保持不变。 -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('js/sw.js?v=20260620', { scope: '/' }).then((reg) => {
          if (reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
          reg.addEventListener('updatefound', () => {
            const sw = reg.installing;
            if (!sw) return;
            sw.addEventListener('statechange', () => {
              if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                sw.postMessage('SKIP_WAITING');
              }
            });
          });
        }).catch(() => {});
        // 仅在已有旧 SW 接管时才需要 reload；首装 claim 不触发刷新，避免新用户白屏闪烁
        if (navigator.serviceWorker.controller) {
          let _swReloaded = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (_swReloaded) return;
            _swReloaded = true;
            window.location.reload();
          });
        }
      });
    }
  </script>
</body>
</html>
