  <!-- 静态资源版本号：发版当天日期 yyyymmdd（同日多次发版可改为 yyyymmdd-HHMM）
       与 sw.js 中 APP_VERSION、manifest.json 中 version 同步维护即可。 -->

  <script>
    // Supabase SDK 多源限时兜底：避免移动端/PC 因首个 CDN 卡住而白屏。
    window.__loadSupabaseSdk = function () {
      if (window.supabase && typeof window.supabase.createClient === 'function') return Promise.resolve(true);
      const urls = [
        'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.min.js',
        'https://unpkg.com/@supabase/supabase-js@2.50.0/dist/umd/supabase.min.js',
        'https://cdn.bootcdn.net/ajax/libs/supabase-js/2.50.0/umd/supabase.min.js'
      ];
      const hasClient = () => !!(window.supabase && typeof window.supabase.createClient === 'function');
      const loadOne = (url, timeoutMs) => new Promise((resolve, reject) => {
        const s = document.createElement('script');
        let done = false;
        const timer = setTimeout(() => {
          if (done) return;
          done = true;
          try { s.remove(); } catch (_) {}
          reject(new Error('timeout'));
        }, timeoutMs);
        s.src = url;
        s.async = true;
        s.onload = () => {
          if (done) return;
          done = true;
          clearTimeout(timer);
          hasClient() ? resolve(true) : reject(new Error('missing client'));
        };
        s.onerror = () => {
          if (done) return;
          done = true;
          clearTimeout(timer);
          try { s.remove(); } catch (_) {}
          reject(new Error('load failed'));
        };
        document.head.appendChild(s);
      });
      return new Promise((resolve) => {
        let settled = false;
        let failed = 0;
        const finish = (ok) => {
          if (settled) return;
          if (ok || failed >= urls.length) {
            settled = true;
            resolve(hasClient());
          }
        };
        urls.forEach((url, i) => {
          setTimeout(() => {
            if (settled || hasClient()) { finish(true); return; }
            loadOne(url, 4500).then(() => finish(true)).catch(() => { failed += 1; finish(false); });
          }, i * 250);
        });
      });
    };
    window.__supabaseReady = window.__loadSupabaseSdk();
  </script>
  <script src="js/config.js?v=20260913-01"></script>

  <!-- 注册 Service Worker；版本号变化时新 SW 安装后会清掉旧 cache
       sw.js 实际位于 /js/sw.js，但通过 scope:'/' + 服务端 Service-Worker-Allowed: /
       响应头，仍然以全站作用域注册，PWA 缓存和离线能力保持不变。 -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('js/sw.js?v=20260913-01', { scope: '/' }).then((reg) => {
          if (reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
          reg.addEventListener('updatefound', () => {
            const sw = reg.installing;
            if (!sw) return;
            sw.addEventListener('statechange', () => {
              if (sw.state === 'installed' && navigator.serviceWorker.controller) {
                sw.postMessage('SKIP_WAITING');
              }
            });
          });
        }).catch(() => {});
        // 仅在已有旧 SW 接管时才需要 reload；首装 claim 不触发刷新，避免新用户白屏闪烁
        if (navigator.serviceWorker.controller) {
          let _swReloaded = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (_swReloaded) return;
            _swReloaded = true;
            window.location.reload();
          });
        }
      });
    }
  </script>
