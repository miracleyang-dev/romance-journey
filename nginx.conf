server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # HTML / manifest / JS / CSS 都走"每次校验"：浏览器仍可命中 304，
    # 但文件一改立刻生效，无需手动加版本号
    location = / {
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache" always;
    }
    # Service Worker：必须永不缓存，且允许根作用域注册
    # 兼容：旧版 /sw.js 与迁移后的 /js/sw.js 均需返回 Service-Worker-Allowed: /
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }
    location = /js/sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Service-Worker-Allowed "/" always;
    }
    location ~* \.(?:js|css)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # 其它资源 & SPA 回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
